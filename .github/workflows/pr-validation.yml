name: PR 验证

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  theory:
    name: Theory and entrypoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: naturaldao/NaturalDAO-2nd
          path: companion
          ref: main
          sparse-checkout: .github
          persist-credentials: false
      - name: 检查两仓入口链接
        run: python3 .github/scripts/check_entrypoint_links.py NaturalDAO companion
      - name: 检查理论文档生成
        env:
          WIKI_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          wiki_dir="$(mktemp -d)"
          python3 .github/scripts/sync_wiki.py \
            --main . \
            --wiki "$wiki_dir" \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$WIKI_SOURCE_BRANCH" \
            --dry-run --strict
