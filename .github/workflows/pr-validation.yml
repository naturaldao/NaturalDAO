name: PR 验证

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  governance:
    name: 治理评测与数据检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: PoL-Governance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 运行离线交付检查
        run: python tools/check.py

  dao-lab:
    name: DAO 实验室测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PoL-Governance/research/PoL2-DAO-Governance-Lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: python -m pip install -e ".[dev]"
      - name: 运行测试
        run: python -m pytest -q
      - name: 验证示例决策链
        run: |
          pol2dao demo --out "$RUNNER_TEMP/pol2dao-ci" > /dev/null
          pol2dao verify "$RUNNER_TEMP/pol2dao-ci/demo_decision_chain.jsonl"

  steward:
    name: Steward 服务测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: POL2-Steward/pol2-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 校验随仓库提供的知识包
        run: python tools/validate_package.py
      - name: 使用内存存储运行服务测试
        run: python -m pytest -q tests

  wiki-preview:
    name: Wiki 生成预检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检查理论文档生成
        env:
          WIKI_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          wiki_dir="$(mktemp -d)"
          python3 .github/scripts/sync_wiki.py \
            --main . \
            --wiki "$wiki_dir" \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$WIKI_SOURCE_BRANCH" \
            --dry-run --strict

  gate:
    name: 合并检查
    runs-on: ubuntu-latest
    needs: [governance, dao-lab, steward, wiki-preview]
    if: ${{ always() }}
    steps:
      - name: 确认所有检查通过
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "验证结果：$RESULTS"
          test "$RESULTS" = "success success success success"
