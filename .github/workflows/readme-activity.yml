name: 刷新首页最近更新

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /.github/scripts/readme_activity.py
      - name: 生成并发布最近更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            python3 .github/scripts/readme_activity.py --repo "$GITHUB_REPOSITORY"
            if git diff --quiet -- README.md; then
              exit 0
            fi
            git commit -m '刷新首页最近更新' -- README.md
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git fetch --no-tags --filter=blob:none origin main
              git reset --hard FETCH_HEAD
            fi
          done
          exit 1
