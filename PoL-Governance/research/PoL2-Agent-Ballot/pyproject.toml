[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pol2-agent-ballot"
version = "0.4.0"
description = "IVXV-inspired sealed, auditable ballots for agent decisions in PoL2 / NaturalDAO"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "shentonyan"}]
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
