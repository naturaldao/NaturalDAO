[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pol2dao"
version = "0.3.0"
description = "PoL2 (Proof of Love2) x DAO: a lab for love-aligned, equal, verifiable AI governance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # the core uses the standard library only

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
pol2dao = "pol2dao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
